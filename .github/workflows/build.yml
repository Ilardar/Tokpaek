name: Build

on:
  push:
    branches: [main]
    tags: ["2*.*", "v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for today's {yy}.{ordinal})"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  build:
    name: Release build
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $inputTag = "${{ github.event.inputs.tag }}"
          $tag = if ($inputTag) { $inputTag } else { $ref }
          $ver = "$((Get-Date).ToString('yy')).$((Get-Date).DayOfYear)"
          if ($tag -match '^\d+\.\d+') {
            $ver = $tag
          } elseif ($tag -match '^v(\d+\.\d+(\.\d+)?)') {
            $ver = $matches[1]
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "installer\tokpaek.iss"
          Copy-Item "dist\Tokpaek-Setup-$ver.exe" "dist\Tokpaek-Setup.exe"

          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item "target\release\tokpaek.exe" "release-files\tokpaek.exe"
          Copy-Item "dist\Tokpaek-Setup-$ver.exe" "release-files\Tokpaek-Setup-$ver.exe"
          Copy-Item "dist\Tokpaek-Setup.exe" "release-files\Tokpaek-Setup.exe"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokpaek-windows-x64
          path: release-files/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tokpaek-windows-x64
      - name: Determine tag and prepare files
        id: vars
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              TAG="$(date -u +%y).$(date -u +%j | sed 's/^0*//')"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          cp tokpaek.exe "Tokpaek-${TAG}.exe"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Tokpaek ${{ steps.vars.outputs.tag }}
          files: |
            tokpaek.exe
            Tokpaek-*.exe
            Tokpaek-Setup*.exe
          generate_release_notes: true
