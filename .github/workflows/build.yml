name: Build

on:
  push:
    branches: [main]
    # Release tags are the build stamp itself: {yy}.{ordinal}, e.g. 26.256.
    tags: ["2[0-9].[1-9]?[0-9]"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  build:
    name: Release build
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: tokpaek-windows-x64
          path: target/release/tokpaek.exe
          if-no-files-found: error

  # Manual dispatch: cut a release tag named after today's build stamp
  # ({yy}.{ordinal}) and push it — the tag push reruns this workflow and the
  # release job below picks it up. The exe's embedded FileVersion uses the
  # same formula (build.rs), so tag and binary always agree.
  cut-tag:
    name: Cut release tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute {yy}.{ordinal} and push the tag
        run: |
          TAG="$(date -u +%y).$(date -u +%j | sed 's/^0*//')"
          echo "Release tag: $TAG"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to cut."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/2')
    permissions:
      contents: write
    steps:
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: tokpaek-windows-x64
      - name: Name the exe after the release
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp tokpaek.exe "Tokpaek-${TAG}.exe"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tokpaek.exe
            Tokpaek-${{ github.ref_name }}.exe
          generate_release_notes: true
